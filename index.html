<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Bwana Family Fund</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* A family passbook, not a fintech dashboard: paper-pale sage, deep growing green,
     harvest gold for anything that needs chasing. */
  --bg:#EDF1EA; --surface:#FFFFFF; --surface-2:#F6F8F4;
  --ink:#12211A; --ink-2:#3D4B43; --muted:#6B7A70; --line:#E2E8E0;
  --g900:#092C1E; --g700:#12503A; --g500:#1D6B48; --g300:#5AA37D; --g100:#DDEFE4;
  --gold:#B07A17; --gold-soft:#F8EFD9; --red:#A93727; --red-soft:#F8E3DE;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(9,44,30,.04), 0 8px 24px -12px rgba(9,44,30,.18);
  --shadow-hero:0 12px 32px -14px rgba(9,44,30,.55);
  --nav-h:66px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-0.018em}
h1{font-size:1.55rem;line-height:1.15}
h2{font-size:1.08rem}
h3{font-size:.98rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.app{max-width:540px;margin:0 auto;padding:0 14px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 2px 8px}
.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(155deg,var(--g500),var(--g900));
  display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.mark svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{font-weight:800;font-size:1.02rem;letter-spacing:-0.02em;color:var(--g900);margin-right:auto;line-height:1.15}
.brand span{display:block;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:0}
.lang{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:650;cursor:pointer;box-shadow:var(--shadow)}
.lang svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.7}

/* ---- surfaces ---- */
.sheet{background:var(--surface);border-radius:var(--r-lg);margin:12px 0;overflow:hidden;box-shadow:var(--shadow)}
.sheet > .row{padding:15px 16px;border-top:1px solid var(--line)}
.sheet > .row:first-child{border-top:0}
.row.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sect{display:flex;align-items:center;gap:9px;padding:15px 16px 11px}
.sect svg{stroke:var(--g500)}
.sect h3{flex:1}

/* ---- hero ---- */
.hero{position:relative;border-radius:var(--r-lg);padding:22px 20px 20px;color:#fff;overflow:hidden;
  background:linear-gradient(158deg,#17593E 0%,var(--g900) 78%);box-shadow:var(--shadow-hero);margin:12px 0}
.hero::after{content:"";position:absolute;right:-64px;top:-72px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.16),transparent 62%)}
.hero > *{position:relative}
.hero .eyebrow{color:rgba(255,255,255,.72);font-size:.85rem;font-weight:600}
.hero .big{font-size:2.4rem;font-weight:800;letter-spacing:-0.035em;line-height:1.06;margin-top:4px}
.hero .big small{font-size:.95rem;font-weight:650;opacity:.72;letter-spacing:0;margin-right:6px;vertical-align:.35em}
.hero .due{color:rgba(255,255,255,.66);font-size:.85rem;margin-top:6px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:650;margin-top:10px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
.hero .status.ok{color:#7FD3A5} .hero .status.wait{color:#F0C868} .hero .status.bad{color:#F2988A}
.status.ok{color:var(--g500)} .status.wait{color:var(--gold)} .status.bad{color:var(--red)}
.hero .btn{width:100%;margin-top:16px;background:#fff;color:var(--g900);border-color:#fff}
.hero .btn:hover{background:#F2F7F3}

/* ---- progress ---- */
.bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:11px 0 8px;box-shadow:inset 0 0 0 1px var(--line)}
.bar > i{display:block;height:100%;min-width:10px;border-radius:999px;background:linear-gradient(90deg,var(--g300),var(--g500));transition:width .6s cubic-bezier(.22,1,.36,1)}
.chip{display:inline-block;background:var(--g100);color:var(--g700);border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:750}

/* ---- stat tiles ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.kv{padding:13px 14px;border-radius:var(--r-md);background:var(--surface-2)}
.kv .top{display:flex;align-items:center;gap:7px;color:var(--muted)}
.kv .top svg{width:16px;height:16px;stroke:var(--g500)}
.kv .v{font-size:1.02rem;font-weight:750;margin-top:5px;letter-spacing:-0.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .top{font-size:.8rem}

/* ---- dark summary card ---- */
.slab{background:linear-gradient(150deg,var(--g700),var(--g900));color:#fff;border-radius:var(--r-lg);
  margin:12px 0;overflow:hidden;box-shadow:var(--shadow-hero)}
.slab .row{display:flex;align-items:center;gap:12px;padding:15px 18px;border-top:1px solid rgba(255,255,255,.09)}
.slab .row:first-child{border-top:0}
.slab .row svg{stroke:rgba(255,255,255,.72)}
.slab .lbl{flex:1;color:rgba(255,255,255,.82);font-weight:600;font-size:.94rem}
.slab .val{white-space:nowrap}
.slab .val{font-weight:800;letter-spacing:-0.02em}

/* ---- avatars & list rows ---- */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;
  letter-spacing:-0.02em;background:var(--g100);color:var(--g700);flex:none}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.prow .l{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.prow .name{display:block;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sub{display:block;color:var(--muted);font-size:.82rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .r{flex:none;text-align:right;display:flex;align-items:center;gap:8px}
.prow .amt{display:block;font-weight:750;letter-spacing:-0.02em;white-space:nowrap;font-size:.95rem}
.prow .av svg{stroke:var(--g700);width:19px;height:19px}
.prow .sub.wrap{white-space:normal;overflow:visible;text-overflow:clip}
.prow.top{align-items:flex-start}
button.prow{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.chev{stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:17px;height:17px;flex:none}
.act{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:15px 16px;
  border-top:1px solid var(--line);cursor:pointer;text-align:left}
.act:first-child{border-top:0}
.act .ico{width:38px;height:38px;border-radius:11px;background:var(--g100);display:grid;place-items:center;flex:none}
.act .ico svg{stroke:var(--g700)}
.act .l{flex:1;min-width:0}
.act .l b{display:block;font-weight:700}
.act .l span{color:var(--muted);font-size:.82rem}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--g500);
  background:var(--g500);color:#fff;border-radius:var(--r-sm);padding:12px 17px;font-weight:750;cursor:pointer;min-height:46px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--g700);border-color:transparent}
.btn.quiet{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:8px 13px;min-height:38px;font-size:.86rem;border-radius:9px}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin:13px 0 0}
label.f > span{display:block;font-size:.85rem;font-weight:650;margin-bottom:6px;color:var(--ink-2)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);
  padding:12px;min-height:46px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
button:focus-visible,.act:focus-visible,.prow:focus-visible{outline:3px solid var(--g100);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin-top:5px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:750;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--g100);color:var(--g700)}
.pill.wait{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--red-soft);color:var(--red)}

/* ---- tabs ---- */
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 2px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;
  font-weight:650;font-size:.83rem;white-space:nowrap;cursor:pointer;color:var(--ink-2);box-shadow:var(--shadow)}
.tabs button.on{background:var(--g900);color:#fff;border-color:var(--g900)}

/* ---- month grid ---- */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;padding:0 16px 16px}
.month-grid div{padding:10px 11px;border-radius:var(--r-md);font-size:.82rem;font-weight:650;background:var(--surface-2)}
.month-grid .paid{background:var(--g100);color:var(--g700)}
.month-grid .partial{background:var(--gold-soft);color:var(--gold)}
.month-grid .missing{color:var(--muted)}
.month-grid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40}
.nav .in{display:flex;width:100%;max-width:540px}
.nav button{flex:1;border:0;background:none;padding:9px 4px 6px;display:flex;flex-direction:column;align-items:center;
  gap:4px;color:var(--muted);font-size:.7rem;font-weight:650;cursor:pointer}
.nav button.on{color:var(--g700)}
.nav button.on svg{stroke-width:2.1}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- misc ---- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);background:var(--g900);
  color:#fff;padding:11px 18px;border-radius:999px;font-weight:650;font-size:.9rem;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:92vw;text-align:center;z-index:50;box-shadow:var(--shadow-hero)}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.center{min-height:82vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(155deg,var(--g500),var(--g900));
  display:grid;place-items:center;margin-bottom:20px;box-shadow:var(--shadow-hero)}
.logo svg{width:33px;height:33px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.spinner{padding:44px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;padding:15px 16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px}
details[open] summary::after{transform:rotate(-135deg);margin-top:2px}
details .body{padding:0 16px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

const $ = sel => document.querySelector(sel);

const amt = n => Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const pad2 = n => String(n).padStart(2,"0");
const localISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseISO = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, m-1, d||1); };
const fmtDate = d => d ? parseISO(d).toLocaleDateString(lang==="sw"?"sw-TZ":"en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtMonth = d => d ? parseISO(d).toLocaleDateString(lang==="sw"?"sw-TZ":"en-GB",{month:"long",year:"numeric"}) : "";
const monthStart = (d=new Date()) => localISO(new Date(d.getFullYear(), d.getMonth(), 1));
const today = () => localISO(new Date());
let toastTimer;
function toast(msg, err=false){ const el=$("#toast"); el.textContent=msg; el.className="toast show"+(err?" err":""); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className="toast",2600); }
function fail(e){ console.error(e); toast(e?.message || e?.error_description || t("error"), true); }
function pillFor(status){ const m={confirmed:"ok",paid:"ok",passed:"ok",active:"ok",repaid:"ok",disbursed:"ok",approved:"ok",submitted:"wait",requested:"wait",open:"wait",pending:"wait",partial:"wait",rejected:"bad",failed:"bad",missing:"bad",defaulted:"bad",suspended:"bad",held:"ok",scheduled:"wait",cancelled:"bad",waived:""}; return `<span class="pill ${m[status]||""}">${esc(t(status))}</span>`; }
function form(el){ const o={}; new FormData(el).forEach((v,k)=>o[k]=v); return o; }
async function busy(btn, fn){ btn.disabled=true; try{ await fn(); } catch(e){ fail(e);} finally{ btn.disabled=false; } }
function memberName(id){ const m=(S.cache.members||[]).find(x=>x.id===id); return m? m.full_name : "—"; }

// ---------------------------------------------------------------- data
async function loadContext(){
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session; if(!session) return;
  const [{data:me},{data:st}] = await Promise.all([
    sb.from("members").select("*").eq("user_id", session.user.id).maybeSingle(),
    sb.rpc("current_settings")
  ]);
  S.me = me; S.settings = Array.isArray(st)? st[0] : st;
  if(me){
    const {data:roles} = await sb.from("role_assignments").select("role").eq("member_id", me.id).lte("term_start", today()).gte("term_end", today());
    S.roles = (roles||[]).map(r=>r.role);
    if(me.language && me.language!==lang){ lang=me.language; localStorage.setItem("lang",lang); }
  }
}
async function loadMembers(){ const {data,error}=await sb.from("members").select("*").order("full_name"); if(error) throw error; S.cache.members=data; return data; }

// ---------------------------------------------------------------- render root
async function render(){
  const app=$("#app");
  if(!S.session){ app.innerHTML=authView(); bindAuth(); return; }
  if(!S.me){ app.innerHTML=`<div class="center"><h1>${esc(t("welcome"))}</h1><p class="muted" style="margin-top:8px">Your account is not linked to a member. Ask an officer to add your username.</p><button class="btn quiet" style="margin-top:16px" id="so">${esc(t("signout"))}</button></div>`; $("#so").onclick=signOut; return; }
  app.innerHTML=`<div class="topbar"><div class="mark">${ic("logo","")}</div><div class="brand">Bwana Family Fund<span>${esc(S.me.full_name)}</span></div><button class="lang" id="lang">${ic("globe","")}${lang==="sw"?"English":"Kiswahili"}</button></div><div id="view"><div class="spinner">${esc(t("loading"))}</div></div>`+navView();
  $("#lang").onclick=async()=>{ lang=lang==="sw"?"en":"sw"; localStorage.setItem("lang",lang); if(S.me) await sb.from("members").update({language:lang}).eq("id",S.me.id); render(); };
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab; render();});
  try{ await ({home:homeView,money:moneyView,loans:loansView,vote:voteView,more:moreView}[S.tab])($("#view")); } catch(e){ fail(e); }
}
function navView(){
  return `<nav class="nav"><div class="in">${["home","money","loans","vote","more"].map(k=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${ic(k,"")}${esc(t(k))}</button>`).join("")}</div></nav>`;
}

// ---------------------------------------------------------------- auth
function authView(){
  const first = S.sub.first;
  return `<div class="center">
    <div class="logo">${ic("logo","")}</div>
    <h1>${esc(t("welcome"))}</h1><p class="muted" style="margin:6px 0 18px">${esc(t("tagline"))}</p>
    <form id="authf" autocomplete="off">
      <label class="f"><span>${esc(t("username"))}</span><input name="username" required pattern="[a-z0-9_]{3,20}" autocapitalize="none" spellcheck="false" inputmode="text"></label>
      <label class="f"><span>${esc(first?t("newpin"):t("pin"))}</span><input name="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>
      ${first?`<label class="f"><span>${esc(t("confirmpin"))}</span><input name="pin2" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>`:""}
      <button class="btn full" style="margin-top:18px" type="submit">${esc(first?t("create"):t("signin"))}</button>
    </form>
    <div style="display:flex;justify-content:space-between;margin-top:16px;align-items:center">
      <button class="btn ghost sm" id="toggle">${esc(first?t("back"):t("first"))}</button>
      <button class="lang" id="lang0">${lang==="sw"?"English":"Kiswahili"}</button>
    </div></div>`;
}
function bindAuth(){
  $("#toggle").onclick=()=>{S.sub.first=!S.sub.first; render();};
  $("#lang0").onclick=()=>{lang=lang==="sw"?"en":"sw"; localStorage.setItem("lang",lang); render();};
  $("#authf").onsubmit=async e=>{
    e.preventDefault(); const f=form(e.target); const btn=e.target.querySelector("button");
    const email=f.username.toLowerCase().trim()+"@"+AUTH_DOMAIN;
    if(!/^\d{6}$/.test(f.pin)) return toast(t("pinformat"),true);
    await busy(btn, async()=>{
      if(S.sub.first){
        if(f.pin!==f.pin2) throw new Error(t("pinmismatch"));
        const {error}=await sb.auth.signUp({email,password:f.pin});
        if(error) throw new Error(/database error/i.test(error.message)? t("notlisted") : /already registered/i.test(error.message)? t("alreadysetup") : error.message);
        S.sub.first=false;
      } else {
        const {error}=await sb.auth.signInWithPassword({email,password:f.pin});
        if(error) throw new Error(/invalid/i.test(error.message)? t("wrongpin") : error.message);
      }
      await loadContext(); render();
    });
  };
}
async function signOut(){ await sb.auth.signOut(); S.session=null; S.me=null; S.roles=[]; render(); }

    has("treasurer")? sb.from("contributions").select("id",{count:"exact",head:true}).eq("status","submitted") : Promise.resolve({data:null,count:0}),
    (has("treasurer")||has("chairperson"))? sb.from("loans").select("id",{count:"exact",head:true}).eq("status","requested") : Promise.resolve({count:0}),
    sb.from("proposals").select("id",{count:"exact",head:true}).eq("status","open"),
    sb.from("contributions").select("status").eq("member_id",S.me.id).eq("period",period).eq("kind","monthly").eq("status","submitted"),
    sb.from("penalties").select("amount").eq("member_id",S.me.id).eq("status","pending")

  const cur=(S.settings.currency||"TZS");
  el.innerHTML=`
  <section class="hero">
    <p class="eyebrow">${esc(t("thismonth"))} · ${esc(fmtMonth(period))}</p>
    <div class="big num"><small>${esc(cur)}</small>${Number(mm?.expected ?? st.monthly_contribution).toLocaleString("en-US")}</div>
    <p class="status ${paidState}">${esc(stateText)}</p>
    <p class="due">${esc(t("dueby"))} ${esc(fmtDate(mm?.due_on))}${isLate?` · ${esc(t("late"))}`:""}</p>
    ${paidState==="bad"?`<button class="btn" id="goPay">${esc(t("submitdeposit"))}</button>`:""}
  </section>

  <div class="sheet">
    <div class="sect">${ic("chart")}<h3>${esc(t("fundvalue"))}</h3><span class="num" style="font-weight:800;letter-spacing:-.02em">${money(fs?.fund_value)}</span></div>
    <div style="padding:0 16px 14px">
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <p class="small muted"><span class="chip num">${pct.toFixed(1)}%</span> ${esc(t("progress"))} ${money(fs?.target_amount)}${fs?.target_date?` ${esc(t("by"))} ${esc(fmtDate(fs.target_date))}`:""}</p>
    </div>
    <div class="grid2">
      <div class="kv"><p class="top small">${ic("wallet")}${esc(t("cash"))}</p><p class="v num">${money(fs?.cash_on_hand)}</p></div>
      <div class="kv"><p class="top small">${ic("hand")}${esc(t("onloan"))}</p><p class="v num">${money(fs?.loans_outstanding)}</p></div>
      <div class="kv"><p class="top small">${ic("seed")}${esc(t("invested"))}</p><p class="v num">${money(fs?.invested_value)}</p></div>
      <div class="kv"><p class="top small">${ic("people")}${esc(t("members"))}</p><p class="v num">${fs?.active_members ?? 0}</p></div>
    </div>
  </div>

  <div class="slab">
    <div class="row">${ic("user")}<span class="lbl">${esc(t("yourshares"))}</span><span class="val num">${money(bal?.total_shares)}</span></div>
    <div class="row">${ic("loans")}<span class="lbl">${esc(t("canborrow"))}</span><span class="val num">${money(bal?.available_to_borrow)}</span></div>
  </div>

  <div class="sheet">
    <div class="sect">${ic(tasks.length?"bell":"check")}<h3>${esc(t("needsyou"))}</h3></div>
    ${tasks.length
      ? tasks.map(x=>`<button class="act" data-go="${esc(x.tab)}"><span class="ico">${ic(x.icon)}</span><span class="l"><b>${esc(x.label)}</b><span>${esc(x.hint)}</span></span>${ic("chev","chev")}</button>`).join("")
      : `<div class="empty" style="padding:8px 16px 20px">${esc(t("allgood"))}</div>`}
  </div>`;
  const gp=$("#goPay"); if(gp) gp.onclick=()=>{S.tab="money"; S.sub.money="submit"; render();};
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.go; S.sub[b.dataset.go]= b.dataset.go==="money"?"review": b.dataset.go==="loans"?"decide": b.dataset.go==="more"?"account":"open"; render();});
}

function bindDepositForm(id, officer){
  const f=document.getElementById(id); if(!f) return;
  const st=S.settings; const kindSel=f.querySelector("select[name=kind]"); const amt=f.querySelector("input[name=amount]");
  kindSel.onchange=()=>{ const k=kindSel.value; amt.value = k==="monthly"? Number(st.monthly_contribution) : k==="initial"? Number(st.initial_deposit) : k==="fine"? Number(st.late_fine) : ""; };
  f.onsubmit=async e=>{ e.preventDefault(); const d=form(f); const btn=f.querySelector("button[type=submit]");
    await busy(btn, async()=>{
      let proof_url=null; const file=f.querySelector("input[name=proof]").files[0];
      if(file){ const path=`${S.session.user.id}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`; const {error}=await sb.storage.from("proofs").upload(path,file); if(error) throw error; proof_url=path; }
      const row={ member_id: officer? d.member_id : S.me.id, kind:d.kind, period: d.period? d.period+"-01" : null, amount:Number(d.amount), paid_on:d.paid_on, channel:d.channel, reference:d.reference||null, note:d.note||null, proof_url, submitted_by:S.me.id, status: officer?"confirmed":"submitted", confirmed_by: officer? S.me.id : null, confirmed_at: officer? new Date().toISOString(): null };
      if(["initial","extra"].includes(d.kind)) row.period=null;
      const {error}=await sb.from("contributions").insert(row); if(error) throw error;
      toast(t("saved")); render();
    }); };
}

const SETTING_FIELDS=["initial_deposit","monthly_contribution","deposit_day","grace_days","late_fine","meeting_absence_fine","missed_months_before_suspension","loan_multiplier","loan_interest_rate_pct","loan_interest_method","loan_min_term_months","loan_max_term_months","loan_lockout_months","emergency_withdrawal_pct","emergency_repayment_months","vote_threshold_pct","vote_window_days","large_investment_threshold","officer_term_months","invest_start_balance","invest_pool_min_pct","invest_pool_max_pct","max_single_venture_pct","target_amount","target_date"];
const MONEY_FIELDS=["initial_deposit","monthly_contribution","late_fine","meeting_absence_fine","large_investment_threshold","invest_start_balance","target_amount"];
function settingDisplay(k,v){ if(v==null||v==="") return "—"; if(k==="loan_interest_method") return t(v); if(k==="target_date") return fmtDate(v); if(MONEY_FIELDS.includes(k)) return money(v); return String(Number(v)); }
async function voteView(el){
  await loadMembers();
  const sub=S.sub.vote||"open"; const tabs=[["open",t("open")],["new",t("newproposal")],["past",t("past")]];
  let body="";
  if(sub==="open"||sub==="past"){
    const q=sb.from("proposals").select("*, votes(*)").order("created_at",{ascending:false});
    const {data}= sub==="open"? await q.eq("status","open") : await q.neq("status","open").limit(50);
    body = data?.length? data.map(p=>{ const yes=p.votes.filter(v=>v.choice==="yes").length, no=p.votes.filter(v=>v.choice==="no").length, needed=Math.ceil(p.eligible_voters*p.threshold_pct/100); const mine=p.votes.find(v=>v.member_id===S.me.id); const canClose=p.status==="open"&&(has("chairperson")||has("secretary")||new Date(p.closes_at)<=new Date());
      const payloadRows = p.kind==="settings_change"&&p.payload? Object.entries(p.payload).map(([k,v])=>`<div class="row between small"><span>${esc(t("s_"+k))}</span><span class="num">${esc(settingDisplay(k,S.settings[k]))} → <b>${esc(settingDisplay(k,v))}</b></span></div>`).join("") : "";
      return `<div class="sheet"><div class="row"><div class="row head" style="padding:0"><h3>${esc(p.title)}</h3>${pillFor(p.status)}</div><p class="small muted">${esc(t(p.kind))}${p.amount?` · ${money(p.amount)}`:""} · ${esc(memberName(p.proposed_by))}</p>${p.description?`<p class="small" style="margin-top:6px">${esc(p.description)}</p>`:""}</div>${payloadRows}
      <div class="row"><p class="small num"><b>${yes}</b> ${esc(t("yes"))} · <b>${no}</b> ${esc(t("no"))} · ${needed} ${esc(t("needed"))} (${p.eligible_voters} ${esc(t("members")).toLowerCase()})</p>${p.status==="open"?`<p class="small muted">${esc(t("closes"))} ${esc(fmtDate(p.closes_at))}${mine?` · ${esc(t("voted"))}: ${esc(t(mine.choice))}`:""}</p>
        <div class="btnrow" style="margin-top:10px">${["yes","no","abstain"].map(c=>`<button class="btn sm ${mine?.choice===c?"":"quiet"}" data-vote="${p.id}" data-choice="${c}">${esc(t(c))}</button>`).join("")}${canClose?`<button class="btn ghost sm" data-close="${p.id}">${esc(t("close"))}</button>`:""}</div>`:""}</div></div>`; }).join("") : `<div class="sheet"><div class="empty">${esc(t("nothing"))}</div></div>`;
  } else {
    body=`<div class="sheet"><div class="row"><form id="propf">
      <label class="f"><span>${esc(t("proposalkind"))}</span><select name="kind" id="pkind">${["investment","expense","settings_change","member_change","other"].map(k=>`<option value="${k}">${esc(t(k))}</option>`).join("")}</select></label>
      <label class="f"><span>${esc(t("title"))}</span><input name="title" required></label>
      <label class="f"><span>${esc(t("description"))}</span><textarea name="description"></textarea></label>
      <div id="amtWrap"><label class="f"><span>${esc(t("amount"))}</span><input name="amount" type="number" inputmode="numeric" min="0" step="1"></label></div>
      <div id="setWrap" style="display:none"><p class="hint" style="margin-top:12px">${esc(t("nochange"))}</p>${SETTING_FIELDS.map(k=>`<label class="f"><span>${esc(t("s_"+k))} <span class="muted">(${esc(t("currentval"))}: ${esc(settingDisplay(k,S.settings[k]))})</span></span>${k==="loan_interest_method"?`<select name="s_${k}"><option value="">—</option><option value="flat_per_month">${esc(t("flat_per_month"))}</option><option value="flat_once">${esc(t("flat_once"))}</option></select>`:k==="target_date"?`<input name="s_${k}" type="date">`:`<input name="s_${k}" type="number" step="any" inputmode="decimal">`}</label>`).join("")}</div>
      <button class="btn full" style="margin-top:16px" type="submit">${esc(t("openvote"))}</button></form></div></div>`;
  }
  el.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button data-s="${k}" class="${sub===k?"on":""}">${esc(l)}</button>`).join("")}</div>${body}`;
  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.sub.vote=b.dataset.s; render();});
  el.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>busy(b,async()=>{const {error}=await sb.rpc("cast_vote",{p_proposal:b.dataset.vote,p_choice:b.dataset.choice}); if(error) throw error; toast(t("voted")); render();}));
  el.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>busy(b,async()=>{const {data,error}=await sb.rpc("close_proposal",{p_proposal:b.dataset.close}); if(error) throw error; toast(t(data)); render();}));
  const pf=$("#propf"); if(pf){ const sync=()=>{ const sc=pf.kind.value==="settings_change"; $("#setWrap").style.display=sc?"":"none"; $("#amtWrap").style.display=sc?"none":""; }; pf.kind.onchange=sync; sync();
    pf.onsubmit=e=>{e.preventDefault(); busy(pf.querySelector("button"),async()=>{ const d=form(pf); let payload=null;
      if(d.kind==="settings_change"){ payload={}; for(const k of SETTING_FIELDS){ const v=d["s_"+k]; if(v!=null && v!=="") payload[k]= (k==="loan_interest_method"||k==="target_date")? v : Number(v); } if(!Object.keys(payload).length) throw new Error(t("nochange")); }
      const {error}=await sb.rpc("open_proposal",{p_kind:d.kind,p_title:d.title,p_description:d.description||null,p_amount:d.amount?Number(d.amount):null,p_payload:payload}); if(error) throw error; S.sub.vote="open"; toast(t("open")); render(); });}; }
}

    <label class="f"><span>${esc(t("language"))}</span><select name="language"><option value="sw" ${m.language==="sw"?"selected":""}>Kiswahili</option><option value="en" ${m.language==="en"?"selected":""}>English</option></select></label>
    ${officer?`<label class="f"><span>${esc(t("status"))}</span><select name="status">${["active","suspended","exited"].map(x=>`<option value="${x}" ${m.status===x?"selected":""}>${esc(t(x))}</option>`).join("")}</select></label>`:""}
    <div class="btnrow" style="margin-top:14px"><button class="btn" type="submit">${esc(t("save"))}</button><button class="btn quiet" type="button" data-cancel>${esc(t("cancel"))}</button></div></form>`;
}
function bindMemberEdit(el, after){
  el.querySelectorAll("form.editf").forEach(f=>{
    f.querySelector("[data-cancel]").onclick=()=>{S.sub.editMember=null; render();};
    f.onsubmit=e=>{e.preventDefault(); busy(f.querySelector("button[type=submit]"),async()=>{
      const d=form(f); const body={member_id:f.dataset.id, full_name:d.full_name, username:d.username, phone:d.phone||null, language:d.language}; if(d.status) body.status=d.status;
      const {data,error}=await sb.functions.invoke("update-member",{body});
      if(error){ let msg=error.message; try{ const r=await error.context?.json(); if(r?.error) msg=r.error; }catch{} throw new Error(msg); }
      if(data?.error) throw new Error(data.error);
      toast(t("saved")); S.sub.editMember=null; await after?.(); render(); });};
  });
}

// ---------------------------------------------------------------- more
async function moreView(el){
  await loadMembers(); const st=S.settings;
  const sub=S.sub.more||"members"; const tabs=[["members",t("memberslist")],["rules",t("rules")],["meet",t("meetings")],["invest",t("investments")],["account",t("account")]];
  let body="";
  if(sub==="members"){
    const {data:roles}=await sb.from("role_assignments").select("*").lte("term_start",today()).gte("term_end",today());
    const {data:bals}=await sb.from("member_balances").select("*");
    body=`<div class="sheet">${S.cache.members.map(m=>{ const rs=(roles||[]).filter(r=>r.member_id===m.id); const b=(bals||[]).find(x=>x.member_id===m.id);
      const editing=S.sub.editMember===m.id;
      const sub=[rs.map(r=>t(r.role)).join(", "), m.user_id?"":t("noaccount"), m.phone].filter(Boolean).join(" · ") || "@"+(m.username||"");
      return `<div class="row" style="flex-direction:column;gap:0">
        <div class="prow">
          <span class="av">${esc(initials(m.full_name))}</span>
          <span class="l"><span class="name">${esc(m.full_name)}</span><span class="sub">${esc(sub)}</span></span>
          <span class="r"><span class="amt num">${amt(b?.total_shares)}</span>${m.status!=="active"?pillFor(m.status):""}${isOfficer()?`<button class="btn ghost sm" data-edit="${editing?"":m.id}" style="padding:6px">${editing?esc(t("cancel")):ic("chev","chev")}</button>`:""}</span>
        </div>${editing?memberEditForm(m,{officer:true}):""}</div>`; }).join("")}</div>
    ${isOfficer()?`<div class="sheet"><details><summary><span style="display:flex;align-items:center;gap:12px"><span class="ico" style="width:38px;height:38px;border-radius:11px;background:var(--g100);display:grid;place-items:center">${ic("plus")}</span>${esc(t("addmember"))}</span></summary><div class="body"><form id="memf">
      <label class="f"><span>${esc(t("fullname"))}</span><input name="full_name" required></label>
      <label class="f"><span>${esc(t("username"))}</span><input name="username" required pattern="[a-z0-9_]{3,20}" autocapitalize="none"><p class="hint">a–z, 0–9, _ · 3–20</p></label>
      <label class="f"><span>${esc(t("phone"))}</span><input name="phone" inputmode="tel"></label>
      <label class="f"><span>${esc(t("language"))}</span><select name="language"><option value="en" selected>English</option><option value="sw">Kiswahili</option></select></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("add"))}</button></form></div></details></div>`:""}
    ${has("chairperson")?`<div class="sheet"><details><summary><span style="display:flex;align-items:center;gap:12px"><span class="ico" style="width:38px;height:38px;border-radius:11px;background:var(--g100);display:grid;place-items:center">${ic("shield")}</span>${esc(t("assignrole"))}</span></summary><div class="body"><form id="rolef">
      <label class="f"><span>${esc(t("member"))}</span><select name="member_id">${S.cache.members.filter(m=>m.status==="active").map(m=>`<option value="${m.id}">${esc(m.full_name)}</option>`).join("")}</select></label>
      <label class="f"><span>${esc(t("role"))}</span><select name="role" id="rolesel">${["admin","chairperson","treasurer","secretary","investment_lead"].map(r=>`<option value="${r}">${esc(t(r))}</option>`).join("")}</select></label>
      <p class="hint" id="rolehint"></p>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("assignrole"))}</button></form></div></details></div>`:""}
    ${isOfficer()?`<div class="sheet"><details><summary><span style="display:flex;align-items:center;gap:12px"><span class="ico" style="width:38px;height:38px;border-radius:11px;background:var(--g100);display:grid;place-items:center">${ic("lock")}</span>${esc(t("resetpin"))}</span></summary><div class="body"><form id="pinf">
      <label class="f"><span>${esc(t("username"))}</span><input name="username" required autocapitalize="none"></label>
      <label class="f"><span>${esc(t("newpin"))}</span><input name="new_pin" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("reset"))}</button></form></div></details></div>`:""}`;
  } else if(sub==="rules"){
    body=`<div class="sheet"><div class="sect">${ic("scroll")}<h3>${esc(t("rules"))}</h3></div><div class="row" style="padding-top:0;border-top:0"><p class="small muted">${esc(t("effective"))} ${esc(fmtDate(st.effective_from))}${st.note?` · ${esc(st.note)}`:""}</p></div>${SETTING_FIELDS.map(k=>`<div class="row between small"><span>${esc(t("s_"+k))}</span><span class="amt num">${esc(settingDisplay(k,st[k]))}</span></div>`).join("")}</div>
      <button class="btn quiet full" id="goProp">${esc(t("proposechange"))}</button>`;
  } else if(sub==="meet"){
    const canRun=has("secretary")||has("chairperson"); const fine=Number(st.meeting_absence_fine||0);
    const {data:ms}=await sb.from("meetings").select("*").order("held_on",{ascending:false});
    const openId=S.sub.meeting; let att=[];
    if(openId){ const {data}=await sb.from("meeting_attendance").select("*").eq("meeting_id",openId); att=data||[]; }
    if(openId && S.sub.attFor!==openId){ const map={}; S.cache.members.filter(m=>m.status==="active").forEach(m=>{map[m.id]="present";}); att.forEach(a=>{map[a.member_id]= a.present?"present":(a.excused?"excused":"absent");}); S.sub.att=map; S.sub.attFor=openId; }
    body=`<div class="sheet">${ms?.length? ms.map(m=>{ const openM=openId===m.id;
      const rows=(canRun&&openM&&m.status!=="cancelled")? S.cache.members.filter(x=>x.status==="active").map(x=>{ const cur=(S.sub.att||{})[x.id]||"present";
        return `<div class="row between" style="padding:9px 0;border-top:1px solid var(--line)"><span class="name" style="flex:1;min-width:0">${esc(x.full_name)}</span><span class="btnrow">${["present","excused","absent"].map(c=>`<button class="btn sm ${cur===c?"":"quiet"}" data-att="${x.id}" data-choice="${c}">${esc(t(c))}</button>`).join("")}</span></div>`; }).join("") : "";
      return `<div class="row" style="flex-direction:column;align-items:stretch"><button class="prow" data-meet="${m.id}"><span class="av">${ic("calendar")}</span><span class="l"><span class="name">${esc(m.title)}</span><span class="sub">${esc(fmtDate(m.held_on))}${m.starts_at?` · ${esc(String(m.starts_at).slice(0,5))}`:""}${m.location?` · ${esc(m.location)}`:""}</span></span><span class="r">${pillFor(m.status)}</span></button>${openM?`${m.agenda?`<p class="small" style="margin-top:10px"><b>${esc(t("agenda"))}</b><br>${esc(m.agenda)}</p>`:""}${canRun?`<form id="minf"><label class="f"><span>${esc(t("minutes"))}</span><textarea name="minutes" rows="4">${esc(m.minutes||"")}</textarea></label><button class="btn quiet full" style="margin-top:10px" type="submit">${esc(t("savemins"))}</button></form>`:(m.minutes?`<p class="small" style="margin-top:10px"><b>${esc(t("minutes"))}</b><br>${esc(m.minutes)}</p>`:"")}${rows?`<div class="sect" style="padding:14px 0 6px">${ic("people")}<h3>${esc(t("attendance"))}</h3></div>${rows}<button class="btn full" style="margin-top:12px" id="saveAtt">${esc(t("saveattendance"))}</button>`:""}${(canRun&&m.status!=="held"&&m.status!=="cancelled")?`<p class="hint" style="margin-top:12px">${fine>0? esc(t("absencefinewarn"))+" "+esc(money(fine)) : esc(t("nofineset"))}</p><button class="btn quiet full" style="margin-top:8px" id="closeMeet">${esc(t("closemeeting"))}</button>`:""}`:""}</div>`; }).join("") : `<div class="empty">${esc(t("nothing"))}</div>`}</div>
    ${canRun?`<div class="sheet"><details><summary>${esc(t("schedulemeeting"))}</summary><div class="body"><form id="meetf">
      <label class="f"><span>${esc(t("title"))}</span><input name="title" required></label>
      <label class="f"><span>${esc(t("date"))}</span><input name="held_on" type="date" value="${today()}" required></label>
      <label class="f"><span>${esc(t("time"))}</span><input name="starts_at" type="time"></label>
      <label class="f"><span>${esc(t("location"))}</span><input name="location"></label>
      <label class="f"><span>${esc(t("agenda"))}</span><textarea name="agenda"></textarea></label>
      <label class="f"><span>${esc(t("status"))}</span><select name="status"><option value="scheduled">${esc(t("scheduled"))}</option><option value="held">${esc(t("held"))}</option></select></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("add"))}</button></form></div></details></div>`:""}`;
  } else if(sub==="invest"){
    const {data}=await sb.from("investments").select("*, investment_valuations(value,valued_on)").order("created_at",{ascending:false});
    const canEdit=has("investment_lead")||has("treasurer");
    body=`<div class="sheet">${data?.length? data.map(i=>{ const v=(i.investment_valuations||[]).sort((a,b)=>b.valued_on.localeCompare(a.valued_on))[0];
      return `<div class="row"><div class="prow"><span class="av">${ic("seed")}</span><span class="l"><span class="name">${esc(i.name)}</span><span class="sub">${esc(t(i.type))}${i.institution?` · ${esc(i.institution)}`:""}${i.invested_on?` · ${esc(fmtDate(i.invested_on))}`:""}${i.expected_annual_return_pct?` · ${Number(i.expected_annual_return_pct)}%/yr`:""}</span></span><div class="r"><span class="amt num">${money(v?v.value:i.amount_invested)}</span>${pillFor(i.status==="exited"?"exited_inv":i.status)}${canEdit&&i.status==="active"?`<button class="btn quiet sm" data-val="${i.id}">${esc(t("addvaluation"))}</button>`:""}</div></div></div>`; }).join("") : `<div class="empty">${esc(t("nothing"))}</div>`}</div>
    ${canEdit?`<div class="sheet"><details><summary>${esc(t("addinvestment"))}</summary><div class="body"><form id="invf">
      <label class="f"><span>${esc(t("name"))}</span><input name="name" required></label>
      <label class="f"><span>${esc(t("type"))}</span><select name="type">${["unit_trust","fixed_deposit","treasury","business","land","stocks","other"].map(k=>`<option value="${k}">${esc(t(k))}</option>`).join("")}</select></label>
      <label class="f"><span>${esc(t("institution"))}</span><input name="institution"></label>
      <label class="f"><span>${esc(t("amount"))}</span><input name="amount_invested" type="number" inputmode="numeric" min="0" step="1" required></label>
      <label class="f"><span>${esc(t("paidon"))}</span><input name="invested_on" type="date" value="${today()}"></label>
      <label class="f"><span>%/yr</span><input name="expected_annual_return_pct" type="number" step="0.1" inputmode="decimal"></label>
      <label class="f"><span>${esc(t("proposalkind"))}</span><select name="status"><option value="active">${esc(t("active"))}</option><option value="proposed">${esc(t("proposed"))}</option></select></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("add"))}</button></form></div></details></div>`:""}`;
  } else {
    const editing=S.sub.editMember===S.me.id;
    const {data:pen}=await sb.from("penalties").select("*").eq("member_id",S.me.id).order("created_at",{ascending:false});
    body=`<div class="sheet"><div class="row"><div class="prow"><span class="av" style="width:52px;height:52px;font-size:1rem">${esc(initials(S.me.full_name))}</span><span class="l"><span class="name">${esc(S.me.full_name)}</span><span class="sub">@${esc(S.me.username||"")}${S.roles.length?" · "+S.roles.map(r=>esc(t(r))).join(", "):""}</span></span>${editing?"":`<button class="btn quiet sm" data-edit="${S.me.id}">${esc(t("editprofile"))}</button>`}</div>${editing?memberEditForm(S.me,{officer:false}):""}</div>
      <div class="row"><form id="cpf"><label class="f"><span>${esc(t("changepin"))}</span><input name="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required placeholder="${esc(t("newpin"))}"></label><button class="btn quiet full" style="margin-top:10px" type="submit">${esc(t("changepin"))}</button></form></div>
      <div class="row"><button class="btn quiet full" id="so">${esc(t("signout"))}</button></div></div>
      <div class="sheet"><div class="sect">${ic("money")}<h3>${esc(t("fines"))}</h3></div>${pen?.length? pen.map(x=>`<div class="row"><div class="prow"><span class="av">${ic("money")}</span><span class="l"><span class="name">${esc(x.reason||t(x.kind))}</span><span class="sub">${esc(x.period? fmtMonth(x.period) : t(x.kind))}</span></span><div class="r"><span class="amt num">${money(x.amount)}</span>${pillFor(x.status)}</div></div></div>`).join("") : `<div class="empty">${esc(t("nothing"))}</div>`}</div>`;
  }
  el.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button data-s="${k}" class="${sub===k?"on":""}">${esc(l)}</button>`).join("")}</div>${body}`;
  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.sub.more=b.dataset.s; render();});
  const on=(id,fn)=>{const f=document.getElementById(id); if(f) f.onsubmit=e=>{e.preventDefault(); busy(f.querySelector("button[type=submit]"),()=>fn(form(f),f));};};
  on("memf", async d=>{ const {error}=await sb.from("members").insert({full_name:d.full_name,username:d.username.toLowerCase().trim(),phone:d.phone||null,language:d.language}); if(error) throw error; toast(t("saved")); render(); });
  on("rolef", async d=>{ const ts=new Date(); let te;
    if(d.role==="admin"){ te="2099-12-31"; }
    else { const e=new Date(ts); e.setMonth(e.getMonth()+Number(st.officer_term_months)); te=localISO(e); }
    const {error}=await sb.from("role_assignments").insert({member_id:d.member_id,role:d.role,term_start:localISO(ts),term_end:te}); if(error) throw error; toast(t("saved")); render(); });
  const rsel=$("#rolesel"); if(rsel){ const rh=$("#rolehint"); const syncRole=()=>{ rh.textContent = rsel.value==="admin" ? t("adminhint") : t("until")+" "+fmtDate(localISO(new Date(new Date().setMonth(new Date().getMonth()+Number(st.officer_term_months))))); }; rsel.onchange=syncRole; syncRole(); }
  on("pinf", async d=>{ const {data,error}=await sb.functions.invoke("reset-pin",{body:{username:d.username,new_pin:d.new_pin}}); if(error){ let msg=error.message; try{ const r=await error.context?.json(); if(r?.error) msg=r.error; }catch{} throw new Error(msg); } if(data?.error) throw new Error(data.error); toast(t("done")); });
  on("invf", async d=>{ const {error}=await sb.from("investments").insert({name:d.name,type:d.type,institution:d.institution||null,amount_invested:Number(d.amount_invested),invested_on:d.invested_on||null,expected_annual_return_pct:d.expected_annual_return_pct?Number(d.expected_annual_return_pct):null,status:d.status,managed_by:S.me.id}); if(error) throw error; toast(t("saved")); render(); });
  on("meetf", async d=>{ const {error}=await sb.from("meetings").insert({title:d.title,held_on:d.held_on,starts_at:d.starts_at||null,location:d.location||null,agenda:d.agenda||null,status:d.status,recorded_by:S.me.id}); if(error) throw error; toast(t("saved")); render(); });
  on("minf", async d=>{ const {error}=await sb.from("meetings").update({minutes:d.minutes||null}).eq("id",S.sub.meeting); if(error) throw error; toast(t("saved")); render(); });
  el.querySelectorAll("[data-meet]").forEach(b=>b.onclick=()=>{ S.sub.meeting = S.sub.meeting===b.dataset.meet? null : b.dataset.meet; S.sub.attFor=null; render(); });
  el.querySelectorAll("[data-att]").forEach(b=>b.onclick=()=>{ if(!S.sub.att) S.sub.att={}; S.sub.att[b.dataset.att]=b.dataset.choice; render(); });
  const satt=$("#saveAtt"); if(satt) satt.onclick=()=>busy(satt, async()=>{ const pr=[],ex=[]; Object.entries(S.sub.att||{}).forEach(([k,v])=>{ if(v==="present") pr.push(k); else if(v==="excused") ex.push(k); }); const {error}=await sb.rpc("save_attendance",{p_meeting:S.sub.meeting,p_present:pr,p_excused:ex}); if(error) throw error; toast(t("saved")); render(); });
  const cmt=$("#closeMeet"); if(cmt) cmt.onclick=()=>busy(cmt, async()=>{ const {data,error}=await sb.rpc("close_meeting",{p_meeting:S.sub.meeting}); if(error) throw error; const n=Number((data&&typeof data==="object")? (data.fines_raised??data.fines??data.count??0) : data)||0; toast(`${n} ${t("finesraised")}`); render(); });
  on("cpf", async d=>{ if(!/^\d{6}$/.test(d.pin)) throw new Error(t("pinformat")); const {error}=await sb.auth.updateUser({password:d.pin}); if(error) throw error; toast(t("saved")); });
  el.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>{ const v=prompt(t("value")); if(!v) return; busy(b,async()=>{const {error}=await sb.from("investment_valuations").insert({investment_id:b.dataset.val,valued_on:today(),value:Number(v)}); if(error) throw error; toast(t("saved")); render();}); });
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{S.sub.editMember=b.dataset.edit; render();});
  bindMemberEdit(el, loadContext);
  const gp=$("#goProp"); if(gp) gp.onclick=()=>{S.tab="vote"; S.sub.vote="new"; render();};
  const so=$("#so"); if(so) so.onclick=signOut;
}

// ---------------------------------------------------------------- boot
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ S.session=null; S.me=null; S.roles=[]; render(); } });
(async()=>{ try{ await loadContext(); } catch(e){ console.error(e); } render(); })();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
