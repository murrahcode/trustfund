<style>
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --ink:#172119; --muted:#66716A; --line:#D5DDD6;
  --primary:#1D6B48; --primary-ink:#0F4A30; --primary-soft:#DCEFE2;
  --attn:#C98A1B; --attn-soft:#FBF0D8; --danger:#B23A2B; --danger-soft:#F8E1DC;
  --r-sheet:14px; --r-ctl:10px; --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:var(--primary-ink)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.app{max-width:540px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-0.01em;color:var(--primary-ink)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet);margin:12px 0;overflow:hidden}
.sheet > .row{padding:14px 16px;border-top:1px solid var(--line)}
.sheet > .row:first-child{border-top:0}
.row.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.row.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero{padding:22px 16px 18px}
.hero .big{font-size:2.2rem;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--primary)}
.status.wait::before{background:var(--attn)}
.status.bad::before{background:var(--danger)}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar > i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .5s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface)}
.kv .v{font-size:1.25rem;font-weight:700;letter-spacing:-0.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:var(--r-ctl);padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary-ink)}
.btn.quiet{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.875rem}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin:12px 0 0}
label.f > span{display:block;font-size:.875rem;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:11px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--primary-soft);border-color:var(--primary)}
textarea{min-height:88px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--bg);color:var(--muted)}
.pill.ok{background:var(--primary-soft);color:var(--primary-ink)}
.pill.wait{background:var(--attn-soft);color:#7A5210}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.list .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.list .row .l{min-width:0}
.list .row .r{text-align:right;white-space:nowrap}
.name{font-weight:600}
.amt{font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav .in{display:flex;width:100%;max-width:540px}
.nav button{flex:1;border:0;background:none;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer}
.nav button.on{color:var(--primary-ink)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center;z-index:50}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:56px;height:56px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.logo svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;margin:12px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.875rem;white-space:nowrap;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px 16px}
.month-grid div{padding:8px 10px;border-radius:var(--r-ctl);font-size:.8rem;font-weight:600;border:1px solid var(--line)}
.month-grid .paid{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
.month-grid .partial{background:var(--attn-soft);border-color:transparent;color:#7A5210}
.month-grid .missing{background:var(--surface);color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:14px 16px;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
details .body{padding:0 16px 16px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.spinner{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar > i{transition:none}}
</style>
</head>

const t = k => (STR[lang][k] ?? STR.en[k] ?? k);

// ---------------------------------------------------------------- state
const S = { session:null, me:null, roles:[], settings:null, tab:"home", sub:{}, cache:{} };
const has = r => S.roles.includes(r);
const isOfficer = () => S.roles.length > 0;

// ---------------------------------------------------------------- utils
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (S.settings?.currency || "TZS") + " " + Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const fmtDate = d => d ? new Date(d).toLocaleDateString(lang==="sw"?"sw-TZ":"en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtMonth = d => d ? new Date(d).toLocaleDateString(lang==="sw"?"sw-TZ":"en-GB",{month:"long",year:"numeric"}) : "";
const monthStart = (d=new Date()) => new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
const today = () => new Date().toISOString().slice(0,10);
let toastTimer;
function toast(msg, err=false){ const el=$("#toast"); el.textContent=msg; el.className="toast show"+(err?" err":""); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className="toast",2600); }
function fail(e){ console.error(e); toast(e?.message || e?.error_description || t("error"), true); }
function pillFor(status){ const m={confirmed:"ok",paid:"ok",passed:"ok",active:"ok",repaid:"ok",disbursed:"ok",approved:"ok",submitted:"wait",requested:"wait",open:"wait",pending:"wait",partial:"wait",rejected:"bad",failed:"bad",missing:"bad",defaulted:"bad",suspended:"bad"}; return `<span class="pill ${m[status]||""}">${esc(t(status))}</span>`; }
function form(el){ const o={}; new FormData(el).forEach((v,k)=>o[k]=v); return o; }
async function busy(btn, fn){ btn.disabled=true; try{ await fn(); } catch(e){ fail(e);} finally{ btn.disabled=false; } }
function memberName(id){ const m=(S.cache.members||[]).find(x=>x.id===id); return m? m.full_name : "—"; }

// ---------------------------------------------------------------- data
async function loadContext(){
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session; if(!session) return;
  const [{data:me},{data:st}] = await Promise.all([
    sb.from("members").select("*").eq("user_id", session.user.id).maybeSingle(),
    sb.rpc("current_settings")
  ]);
  S.me = me; S.settings = Array.isArray(st)? st[0] : st;
  if(me){
    const {data:roles} = await sb.from("role_assignments").select("role").eq("member_id", me.id).lte("term_start", today()).gte("term_end", today());
    S.roles = (roles||[]).map(r=>r.role);
    if(me.language && me.language!==lang){ lang=me.language; localStorage.setItem("lang",lang); }
  }
}
async function loadMembers(){ const {data,error}=await sb.from("members").select("*").order("full_name"); if(error) throw error; S.cache.members=data; return data; }

function authView(){
  const first = S.sub.first;
  return `<div class="center">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg></div>

    <form id="authf" autocomplete="off">
      <label class="f"><span>${esc(t("username"))}</span><input name="username" required pattern="[a-z0-9_]{3,20}" autocapitalize="none" spellcheck="false" inputmode="text"></label>
      <label class="f"><span>${esc(first?t("newpin"):t("pin"))}</span><input name="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>
      ${first?`<label class="f"><span>${esc(t("confirmpin"))}</span><input name="pin2" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>`:""}
      <button class="btn full" style="margin-top:18px" type="submit">${esc(first?t("create"):t("signin"))}</button>
    </form>
    <div style="display:flex;justify-content:space-between;margin-top:16px;align-items:center">
      <button class="btn ghost sm" id="toggle">${esc(first?t("back"):t("first"))}</button>
      <button class="lang" id="lang0">${lang==="sw"?"English":"Kiswahili"}</button>
    </div></div>`;
}
function bindAuth(){
  $("#toggle").onclick=()=>{S.sub.first=!S.sub.first; render();};
  $("#lang0").onclick=()=>{lang=lang==="sw"?"en":"sw"; localStorage.setItem("lang",lang); render();};
  $("#authf").onsubmit=async e=>{
    e.preventDefault(); const f=form(e.target); const btn=e.target.querySelector("button");
    const email=f.username.toLowerCase().trim()+"@"+AUTH_DOMAIN;
    if(!/^\d{6}$/.test(f.pin)) return toast(t("pinformat"),true);
    await busy(btn, async()=>{
      if(S.sub.first){
        if(f.pin!==f.pin2) throw new Error(t("pinmismatch"));
        const {error}=await sb.auth.signUp({email,password:f.pin});
        if(error) throw new Error(/database error/i.test(error.message)? t("notlisted") : /already registered/i.test(error.message)? t("alreadysetup") : error.message);
        S.sub.first=false;
      } else {
        const {error}=await sb.auth.signInWithPassword({email,password:f.pin});
        if(error) throw new Error(/invalid/i.test(error.message)? t("wrongpin") : error.message);
      }
      await loadContext(); render();
    });
  };
}
async function signOut(){ await sb.auth.signOut(); S.session=null; S.me=null; S.roles=[]; render(); }

// ---------------------------------------------------------------- home
async function homeView(el){
  const st=S.settings; const period=monthStart();
  const [{data:fs},{data:mm},{data:bal},{data:pendingC},{data:loanReqs},{data:openP},{data:mine}]=await Promise.all([
    sb.from("fund_summary").select("*").single(),
    sb.from("member_month_status").select("*").eq("member_id",S.me.id).eq("period",period).maybeSingle(),
    sb.from("member_balances").select("*").eq("member_id",S.me.id).single(),
    has("treasurer")? sb.from("contributions").select("id",{count:"exact",head:true}).eq("status","submitted") : Promise.resolve({data:null,count:0}),
    (has("treasurer")||has("chairperson"))? sb.from("loans").select("id",{count:"exact",head:true}).eq("status","requested") : Promise.resolve({count:0}),
    sb.from("proposals").select("id",{count:"exact",head:true}).eq("status","open"),
    sb.from("contributions").select("status").eq("member_id",S.me.id).eq("period",period).eq("kind","monthly").eq("status","submitted")
  ].map(p=>p.then(r=>r, e=>({data:null,count:0,error:e}))));
  const paidState = mm?.status==="paid" ? "ok" : (mine?.length? "wait" : (mm?.status==="partial"?"wait":"bad"));
  const stateText = mm?.status==="paid" ? t("paid") : (mine?.length? t("pending") : (mm?.status==="partial"? t("partial") : t("notyet")));
  const isLate = mm && mm.status!=="paid" && !mine?.length && new Date(mm.due_on) < new Date(today());
  const pct = fs? Math.min(100, (Number(fs.fund_value)/Number(fs.target_amount))*100) : 0;
  const tasks=[];
  if(has("treasurer") && pendingC?.count) tasks.push(`${pendingC.count} ${t("toconfirm")}`);
  if((has("treasurer")||has("chairperson")) && loanReqs?.count) tasks.push(`${loanReqs.count} ${t("loanreqs")}`);
  if(openP?.count) tasks.push(`${openP.count} ${t("openvotes")}`);
  el.innerHTML=`
  <div class="sheet"><div class="hero">
    <p class="muted">${esc(t("thismonth"))} · ${esc(fmtMonth(period))}</p>
    <div class="big num">${money(mm?.expected ?? st.monthly_contribution)}</div>
    <p class="status ${paidState}" style="margin-top:8px">${esc(stateText)}</p>
    <p class="small muted" style="margin-top:4px">${esc(t("dueby"))} ${esc(fmtDate(mm?.due_on))}${isLate?` · <span style="color:var(--danger)">${esc(t("late"))}</span>`:""}</p>
    ${paidState==="bad"?`<button class="btn full" style="margin-top:14px" id="goPay">${esc(t("submitdeposit"))}</button>`:""}
  </div></div>
  <div class="sheet"><div class="row">
    <div class="row head" style="padding:0"><h2>${esc(t("fundvalue"))}</h2><span class="num amt">${money(fs?.fund_value)}</span></div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <p class="small muted num">${pct.toFixed(1)}% ${esc(t("progress"))} · ${esc(t("target"))} ${money(fs?.target_amount)}${fs?.target_date?` · ${esc(fmtDate(fs.target_date))}`:""}</p>
  </div>
  <div class="row grid2" style="border-top:0;padding-top:0">
    <div class="kv"><p class="small muted">${esc(t("cash"))}</p><p class="v num">${money(fs?.cash_on_hand)}</p></div>
    <div class="kv"><p class="small muted">${esc(t("onloan"))}</p><p class="v num">${money(fs?.loans_outstanding)}</p></div>
    <div class="kv"><p class="small muted">${esc(t("invested"))}</p><p class="v num">${money(fs?.invested_value)}</p></div>
    <div class="kv"><p class="small muted">${esc(t("members"))}</p><p class="v num">${fs?.active_members ?? 0}</p></div>
  </div></div>
  <div class="sheet">
    <div class="row between"><span>${esc(t("yourshares"))}</span><span class="amt num">${money(bal?.total_shares)}</span></div>
    <div class="row between"><span>${esc(t("canborrow"))}</span><span class="amt num">${money(bal?.available_to_borrow)}</span></div>
  </div>
  <div class="sheet"><div class="row"><h3>${esc(t("needsyou"))}</h3></div>
    ${tasks.length? tasks.map(x=>`<div class="row">${esc(x)}</div>`).join("") : `<div class="row muted">${esc(t("allgood"))}</div>`}
  </div>`;
  const gp=$("#goPay"); if(gp) gp.onclick=()=>{S.tab="money"; render();};
}

function bindDepositForm(id, officer){
  const f=document.getElementById(id); if(!f) return;
  const st=S.settings; const kindSel=f.querySelector("select[name=kind]"); const amt=f.querySelector("input[name=amount]");
  kindSel.onchange=()=>{ const k=kindSel.value; amt.value = k==="monthly"? Number(st.monthly_contribution) : k==="initial"? Number(st.initial_deposit) : k==="fine"? Number(st.late_fine) : ""; };
  f.onsubmit=async e=>{ e.preventDefault(); const d=form(f); const btn=f.querySelector("button[type=submit]");
    await busy(btn, async()=>{
      let proof_url=null; const file=f.querySelector("input[name=proof]").files[0];
      if(file){ const path=`${S.session.user.id}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`; const {error}=await sb.storage.from("proofs").upload(path,file); if(error) throw error; proof_url=path; }
      const row={ member_id: officer? d.member_id : S.me.id, kind:d.kind, period: d.period? d.period+"-01" : null, amount:Number(d.amount), paid_on:d.paid_on, channel:d.channel, reference:d.reference||null, note:d.note||null, proof_url, submitted_by:S.me.id, status: officer?"confirmed":"submitted", confirmed_by: officer? S.me.id : null, confirmed_at: officer? new Date().toISOString(): null };
      if(["initial","extra"].includes(d.kind)) row.period=null;
      const {error}=await sb.from("contributions").insert(row); if(error) throw error;
      toast(t("saved")); render();
    }); };
}

  const lf=$("#loanf"); if(lf){ const upd=()=>{ const p=Number(lf.principal.value||0), m=Number(lf.term.value); const i = st.loan_interest_method==="flat_per_month"? p*st.loan_interest_rate_pct/100*m : p*st.loan_interest_rate_pct/100; $("#repayHint").textContent=`${t("youllrepay")} ${money(p+i)} (${money(i)} ${t("interest")})`; }; lf.oninput=upd; upd();
    lf.onsubmit=e=>{e.preventDefault(); busy(lf.querySelector("button"),async()=>{const {error}=await sb.rpc("request_loan",{p_principal:Number(lf.principal.value),p_term_months:Number(lf.term.value),p_purpose:lf.purpose.value||null}); if(error) throw error; toast(t("requested")); render();});}; }
  const rf=$("#repf"); if(rf){ rf.onsubmit=async e=>{e.preventDefault(); busy(rf.querySelector("button"),async()=>{ const {data:l}=await sb.from("loans").select("id").eq("member_id",S.me.id).eq("status","disbursed").single(); const {error}=await sb.from("loan_repayments").insert({loan_id:l.id,amount:Number(rf.amount.value),paid_on:rf.paid_on.value,reference:rf.reference.value||null,submitted_by:S.me.id,status:"submitted"}); if(error) throw error; toast(t("submitted")); render();});}; }
  const rpc=(name,args,msg)=>b=>busy(b,async()=>{const {error}=await sb.rpc(name,args(b)); if(error) throw error; toast(msg); render();});
  el.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>rpc("decide_loan",b=>({p_loan:b.dataset.approve,p_approve:true}),t("approved"))(b));
  el.querySelectorAll("[data-rejectl]").forEach(b=>b.onclick=()=>{const r=prompt(t("rejectreason")); if(r===null) return; rpc("decide_loan",b=>({p_loan:b.dataset.rejectl,p_approve:false,p_note:r}),t("rejected"))(b);});
  el.querySelectorAll("[data-disburse]").forEach(b=>b.onclick=()=>rpc("disburse_loan",b=>({p_loan:b.dataset.disburse}),t("done"))(b));
  el.querySelectorAll("[data-rok]").forEach(b=>b.onclick=()=>rpc("review_repayment",b=>({p_id:b.dataset.rok,p_approve:true}),t("confirmed"))(b));
  el.querySelectorAll("[data-rno]").forEach(b=>b.onclick=()=>{const r=prompt(t("rejectreason")); if(r===null) return; rpc("review_repayment",b=>({p_id:b.dataset.rno,p_approve:false,p_reason:r}),t("rejected"))(b);});
}

// ---------------------------------------------------------------- vote
const SETTING_FIELDS=["initial_deposit","monthly_contribution","deposit_day","grace_days","late_fine","missed_months_before_suspension","loan_multiplier","loan_interest_rate_pct","loan_interest_method","loan_min_term_months","loan_max_term_months","loan_lockout_months","emergency_withdrawal_pct","emergency_repayment_months","vote_threshold_pct","vote_window_days","large_investment_threshold","officer_term_months","invest_start_balance","invest_pool_min_pct","invest_pool_max_pct","max_single_venture_pct","target_amount","target_date"];
const MONEY_FIELDS=["initial_deposit","monthly_contribution","late_fine","large_investment_threshold","invest_start_balance","target_amount"];
function settingDisplay(k,v){ if(v==null||v==="") return "—"; if(k==="loan_interest_method") return t(v); if(k==="target_date") return fmtDate(v); if(MONEY_FIELDS.includes(k)) return money(v); return String(Number(v)); }
async function voteView(el){
  await loadMembers();
  const sub=S.sub.vote||"open"; const tabs=[["open",t("open")],["new",t("newproposal")],["past",t("past")]];
  let body="";
  if(sub==="open"||sub==="past"){
    const q=sb.from("proposals").select("*, votes(*)").order("created_at",{ascending:false});
    const {data}= sub==="open"? await q.eq("status","open") : await q.neq("status","open").limit(50);
    body = data?.length? data.map(p=>{ const yes=p.votes.filter(v=>v.choice==="yes").length, no=p.votes.filter(v=>v.choice==="no").length, needed=Math.ceil(p.eligible_voters*p.threshold_pct/100); const mine=p.votes.find(v=>v.member_id===S.me.id); const canClose=p.status==="open"&&(has("chairperson")||has("secretary")||new Date(p.closes_at)<=new Date());
      const payloadRows = p.kind==="settings_change"&&p.payload? Object.entries(p.payload).map(([k,v])=>`<div class="row between small"><span>${esc(t("s_"+k))}</span><span class="num">${esc(settingDisplay(k,S.settings[k]))} → <b>${esc(settingDisplay(k,v))}</b></span></div>`).join("") : "";
      return `<div class="sheet"><div class="row"><div class="row head" style="padding:0"><h3>${esc(p.title)}</h3>${pillFor(p.status)}</div><p class="small muted">${esc(t(p.kind))}${p.amount?` · ${money(p.amount)}`:""} · ${esc(memberName(p.proposed_by))}</p>${p.description?`<p class="small" style="margin-top:6px">${esc(p.description)}</p>`:""}</div>${payloadRows}
      <div class="row"><p class="small num"><b>${yes}</b> ${esc(t("yes"))} · <b>${no}</b> ${esc(t("no"))} · ${needed} ${esc(t("needed"))} (${p.eligible_voters} ${esc(t("members")).toLowerCase()})</p>${p.status==="open"?`<p class="small muted">${esc(t("closes"))} ${esc(fmtDate(p.closes_at))}${mine?` · ${esc(t("voted"))}: ${esc(t(mine.choice))}`:""}</p>
        <div class="btnrow" style="margin-top:10px">${["yes","no","abstain"].map(c=>`<button class="btn sm ${mine?.choice===c?"":"quiet"}" data-vote="${p.id}" data-choice="${c}">${esc(t(c))}</button>`).join("")}${canClose?`<button class="btn ghost sm" data-close="${p.id}">${esc(t("close"))}</button>`:""}</div>`:""}</div></div>`; }).join("") : `<div class="sheet"><div class="empty">${esc(t("nothing"))}</div></div>`;
  } else {
    body=`<div class="sheet"><div class="row"><form id="propf">
      <label class="f"><span>${esc(t("proposalkind"))}</span><select name="kind" id="pkind">${["investment","expense","settings_change","member_change","other"].map(k=>`<option value="${k}">${esc(t(k))}</option>`).join("")}</select></label>
      <label class="f"><span>${esc(t("title"))}</span><input name="title" required></label>
      <label class="f"><span>${esc(t("description"))}</span><textarea name="description"></textarea></label>
      <div id="amtWrap"><label class="f"><span>${esc(t("amount"))}</span><input name="amount" type="number" inputmode="numeric" min="0" step="1"></label></div>
      <div id="setWrap" style="display:none"><p class="hint" style="margin-top:12px">${esc(t("nochange"))}</p>${SETTING_FIELDS.map(k=>`<label class="f"><span>${esc(t("s_"+k))} <span class="muted">(${esc(t("currentval"))}: ${esc(settingDisplay(k,S.settings[k]))})</span></span>${k==="loan_interest_method"?`<select name="s_${k}"><option value="">—</option><option value="flat_per_month">${esc(t("flat_per_month"))}</option><option value="flat_once">${esc(t("flat_once"))}</option></select>`:k==="target_date"?`<input name="s_${k}" type="date">`:`<input name="s_${k}" type="number" step="any" inputmode="decimal">`}</label>`).join("")}</div>
      <button class="btn full" style="margin-top:16px" type="submit">${esc(t("openvote"))}</button></form></div></div>`;
  }
  el.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button data-s="${k}" class="${sub===k?"on":""}">${esc(l)}</button>`).join("")}</div>${body}`;
  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.sub.vote=b.dataset.s; render();});
  el.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>busy(b,async()=>{const {error}=await sb.rpc("cast_vote",{p_proposal:b.dataset.vote,p_choice:b.dataset.choice}); if(error) throw error; toast(t("voted")); render();}));
  el.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>busy(b,async()=>{const {data,error}=await sb.rpc("close_proposal",{p_proposal:b.dataset.close}); if(error) throw error; toast(t(data)); render();}));
  const pf=$("#propf"); if(pf){ const sync=()=>{ const sc=pf.kind.value==="settings_change"; $("#setWrap").style.display=sc?"":"none"; $("#amtWrap").style.display=sc?"none":""; }; pf.kind.onchange=sync; sync();
    pf.onsubmit=e=>{e.preventDefault(); busy(pf.querySelector("button"),async()=>{ const d=form(pf); let payload=null;
      if(d.kind==="settings_change"){ payload={}; for(const k of SETTING_FIELDS){ const v=d["s_"+k]; if(v!=null && v!=="") payload[k]= (k==="loan_interest_method"||k==="target_date")? v : Number(v); } if(!Object.keys(payload).length) throw new Error(t("nochange")); }
      const {error}=await sb.rpc("open_proposal",{p_kind:d.kind,p_title:d.title,p_description:d.description||null,p_amount:d.amount?Number(d.amount):null,p_payload:payload}); if(error) throw error; S.sub.vote="open"; toast(t("open")); render(); });}; }
}

// ---------------------------------------------------------------- member edit (via update-member function)
function memberEditForm(m, {officer}){
  return `<form class="editf" data-id="${m.id}">
    <label class="f"><span>${esc(t("fullname"))}</span><input name="full_name" value="${esc(m.full_name)}" required></label>
    <label class="f"><span>${esc(t("username"))}</span><input name="username" value="${esc(m.username||"")}" pattern="[a-z0-9_]{3,20}" autocapitalize="none" required><p class="hint">${esc(t("usernamehint"))}</p></label>
    <label class="f"><span>${esc(t("phone"))}</span><input name="phone" value="${esc(m.phone||"")}" inputmode="tel"></label>
    <label class="f"><span>${esc(t("language"))}</span><select name="language"><option value="sw" ${m.language==="sw"?"selected":""}>Kiswahili</option><option value="en" ${m.language==="en"?"selected":""}>English</option></select></label>
    ${officer?`<label class="f"><span>${esc(t("status"))}</span><select name="status">${["active","suspended","exited"].map(x=>`<option value="${x}" ${m.status===x?"selected":""}>${esc(t(x))}</option>`).join("")}</select></label>`:""}
    <div class="btnrow" style="margin-top:14px"><button class="btn" type="submit">${esc(t("save"))}</button><button class="btn quiet" type="button" data-cancel>${esc(t("cancel"))}</button></div></form>`;
}
function bindMemberEdit(el, after){
  el.querySelectorAll("form.editf").forEach(f=>{
    f.querySelector("[data-cancel]").onclick=()=>{S.sub.editMember=null; render();};
    f.onsubmit=e=>{e.preventDefault(); busy(f.querySelector("button[type=submit]"),async()=>{
      const d=form(f); const body={member_id:f.dataset.id, full_name:d.full_name, username:d.username, phone:d.phone||null, language:d.language}; if(d.status) body.status=d.status;
      const {data,error}=await sb.functions.invoke("update-member",{body});
      if(error){ let msg=error.message; try{ const r=await error.context?.json(); if(r?.error) msg=r.error; }catch{} throw new Error(msg); }
      if(data?.error) throw new Error(data.error);
      toast(t("saved")); S.sub.editMember=null; await after?.(); render(); });};
  });
}

// ---------------------------------------------------------------- more
async function moreView(el){
  await loadMembers(); const st=S.settings;
  const sub=S.sub.more||"members"; const tabs=[["members",t("memberslist")],["rules",t("rules")],["invest",t("investments")],["account",t("account")]];
  let body="";
  if(sub==="members"){
    const {data:roles}=await sb.from("role_assignments").select("*").lte("term_start",today()).gte("term_end",today());
    const {data:bals}=await sb.from("member_balances").select("*");
    body=`<div class="sheet list">${S.cache.members.map(m=>{ const rs=(roles||[]).filter(r=>r.member_id===m.id); const b=(bals||[]).find(x=>x.member_id===m.id);
      const editing=S.sub.editMember===m.id;
      return `<div class="row" style="flex-direction:column"><div style="display:flex;justify-content:space-between;width:100%;gap:12px"><div class="l"><p class="name">${esc(m.full_name)} <span class="muted small">@${esc(m.username||"")}</span></p><p class="small muted">${rs.map(r=>esc(t(r.role))).join(", ")}${rs.length?" · ":""}${m.user_id?"":esc(t("noaccount"))+" · "}${esc(m.phone||"")}</p></div><div class="r"><p class="amt num">${money(b?.total_shares)}</p>${m.status!=="active"?pillFor(m.status):""}${isOfficer()&&!editing?`<div style="margin-top:6px"><button class="btn quiet sm" data-edit="${m.id}">${esc(t("edit"))}</button></div>`:""}</div></div>${editing?memberEditForm(m,{officer:true}):""}</div>`; }).join("")}</div>
    ${isOfficer()?`<div class="sheet"><details><summary>${esc(t("addmember"))}</summary><div class="body"><form id="memf">
      <label class="f"><span>${esc(t("fullname"))}</span><input name="full_name" required></label>
      <label class="f"><span>${esc(t("username"))}</span><input name="username" required pattern="[a-z0-9_]{3,20}" autocapitalize="none"><p class="hint">a–z, 0–9, _ · 3–20</p></label>
      <label class="f"><span>${esc(t("phone"))}</span><input name="phone" inputmode="tel"></label>
      <label class="f"><span>${esc(t("language"))}</span><select name="language"><option value="sw">Kiswahili</option><option value="en">English</option></select></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("add"))}</button></form></div></details></div>`:""}
    ${has("chairperson")?`<div class="sheet"><details><summary>${esc(t("assignrole"))}</summary><div class="body"><form id="rolef">
      <label class="f"><span>${esc(t("member"))}</span><select name="member_id">${S.cache.members.filter(m=>m.status==="active").map(m=>`<option value="${m.id}">${esc(m.full_name)}</option>`).join("")}</select></label>
      <label class="f"><span>${esc(t("role"))}</span><select name="role">${["chairperson","treasurer","secretary","investment_lead"].map(r=>`<option value="${r}">${esc(t(r))}</option>`).join("")}</select></label>
      <p class="hint">${esc(t("until"))} ${esc(fmtDate(new Date(new Date().setMonth(new Date().getMonth()+Number(st.officer_term_months)))))}</p>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("assignrole"))}</button></form></div></details></div>`:""}
    ${isOfficer()?`<div class="sheet"><details><summary>${esc(t("resetpin"))}</summary><div class="body"><form id="pinf">
      <label class="f"><span>${esc(t("username"))}</span><input name="username" required autocapitalize="none"></label>
      <label class="f"><span>${esc(t("newpin"))}</span><input name="new_pin" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("reset"))}</button></form></div></details></div>`:""}`;
  } else if(sub==="rules"){
    body=`<div class="sheet"><div class="row"><p class="small muted">${esc(t("effective"))} ${esc(fmtDate(st.effective_from))}${st.note?` · ${esc(st.note)}`:""}</p></div>${SETTING_FIELDS.map(k=>`<div class="row between small"><span>${esc(t("s_"+k))}</span><span class="amt num">${esc(settingDisplay(k,st[k]))}</span></div>`).join("")}</div>
      <button class="btn quiet full" id="goProp">${esc(t("proposechange"))}</button>`;
  } else if(sub==="invest"){
    const {data}=await sb.from("investments").select("*, investment_valuations(value,valued_on)").order("created_at",{ascending:false});
    const canEdit=has("investment_lead")||has("treasurer");
    body=`<div class="sheet list">${data?.length? data.map(i=>{ const v=(i.investment_valuations||[]).sort((a,b)=>b.valued_on.localeCompare(a.valued_on))[0];
      return `<div class="row"><div class="l"><p class="name">${esc(i.name)}</p><p class="small muted">${esc(t(i.type))}${i.institution?` · ${esc(i.institution)}`:""}${i.invested_on?` · ${esc(fmtDate(i.invested_on))}`:""}${i.expected_annual_return_pct?` · ${Number(i.expected_annual_return_pct)}%/yr`:""}</p></div><div class="r"><p class="amt num">${money(v?v.value:i.amount_invested)}</p>${pillFor(i.status==="exited"?"exited_inv":i.status)}${canEdit&&i.status==="active"?`<div style="margin-top:6px"><button class="btn quiet sm" data-val="${i.id}">${esc(t("addvaluation"))}</button></div>`:""}</div></div>`; }).join("") : `<div class="empty">${esc(t("nothing"))}</div>`}</div>
    ${canEdit?`<div class="sheet"><details><summary>${esc(t("addinvestment"))}</summary><div class="body"><form id="invf">
      <label class="f"><span>${esc(t("name"))}</span><input name="name" required></label>
      <label class="f"><span>${esc(t("type"))}</span><select name="type">${["unit_trust","fixed_deposit","treasury","business","land","stocks","other"].map(k=>`<option value="${k}">${esc(t(k))}</option>`).join("")}</select></label>
      <label class="f"><span>${esc(t("institution"))}</span><input name="institution"></label>
      <label class="f"><span>${esc(t("amount"))}</span><input name="amount_invested" type="number" inputmode="numeric" min="0" step="1" required></label>
      <label class="f"><span>${esc(t("paidon"))}</span><input name="invested_on" type="date" value="${today()}"></label>
      <label class="f"><span>%/yr</span><input name="expected_annual_return_pct" type="number" step="0.1" inputmode="decimal"></label>
      <label class="f"><span>${esc(t("proposalkind"))}</span><select name="status"><option value="active">${esc(t("active"))}</option><option value="proposed">${esc(t("proposed"))}</option></select></label>
      <button class="btn full" style="margin-top:14px" type="submit">${esc(t("add"))}</button></form></div></details></div>`:""}`;
  } else {
    const editing=S.sub.editMember===S.me.id;
    body=`<div class="sheet"><div class="row"><div class="row between" style="padding:0"><div><p class="name">${esc(S.me.full_name)} <span class="muted small">@${esc(S.me.username||"")}</span></p><p class="small muted">${S.roles.map(r=>esc(t(r))).join(", ")||esc(t("member"))}${S.me.phone?` · ${esc(S.me.phone)}`:""}</p></div>${editing?"":`<button class="btn quiet sm" data-edit="${S.me.id}">${esc(t("editprofile"))}</button>`}</div>${editing?memberEditForm(S.me,{officer:false}):""}</div>
      <div class="row"><form id="cpf"><label class="f"><span>${esc(t("changepin"))}</span><input name="pin" type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" required placeholder="${esc(t("newpin"))}"></label><button class="btn quiet full" style="margin-top:10px" type="submit">${esc(t("changepin"))}</button></form></div>
      <div class="row"><button class="btn quiet full" id="so">${esc(t("signout"))}</button></div></div>`;
  }
  el.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button data-s="${k}" class="${sub===k?"on":""}">${esc(l)}</button>`).join("")}</div>${body}`;
  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.sub.more=b.dataset.s; render();});
  const on=(id,fn)=>{const f=document.getElementById(id); if(f) f.onsubmit=e=>{e.preventDefault(); busy(f.querySelector("button[type=submit]"),()=>fn(form(f),f));};};
  on("memf", async d=>{ const {error}=await sb.from("members").insert({full_name:d.full_name,username:d.username.toLowerCase().trim(),phone:d.phone||null,language:d.language}); if(error) throw error; toast(t("saved")); render(); });
  on("rolef", async d=>{ const ts=new Date(); const te=new Date(ts); te.setMonth(te.getMonth()+Number(st.officer_term_months)); const {error}=await sb.from("role_assignments").insert({member_id:d.member_id,role:d.role,term_start:ts.toISOString().slice(0,10),term_end:te.toISOString().slice(0,10)}); if(error) throw error; toast(t("saved")); render(); });
  on("pinf", async d=>{ const {data,error}=await sb.functions.invoke("reset-pin",{body:{username:d.username,new_pin:d.new_pin}}); if(error){ let msg=error.message; try{ const r=await error.context?.json(); if(r?.error) msg=r.error; }catch{} throw new Error(msg); } if(data?.error) throw new Error(data.error); toast(t("done")); });
  on("invf", async d=>{ const {error}=await sb.from("investments").insert({name:d.name,type:d.type,institution:d.institution||null,amount_invested:Number(d.amount_invested),invested_on:d.invested_on||null,expected_annual_return_pct:d.expected_annual_return_pct?Number(d.expected_annual_return_pct):null,status:d.status,managed_by:S.me.id}); if(error) throw error; toast(t("saved")); render(); });
  on("cpf", async d=>{ if(!/^\d{6}$/.test(d.pin)) throw new Error(t("pinformat")); const {error}=await sb.auth.updateUser({password:d.pin}); if(error) throw error; toast(t("saved")); });
  el.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>{ const v=prompt(t("value")); if(!v) return; busy(b,async()=>{const {error}=await sb.from("investment_valuations").insert({investment_id:b.dataset.val,valued_on:today(),value:Number(v)}); if(error) throw error; toast(t("saved")); render();}); });
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{S.sub.editMember=b.dataset.edit; render();});
  bindMemberEdit(el, loadContext);
  const gp=$("#goProp"); if(gp) gp.onclick=()=>{S.tab="vote"; S.sub.vote="new"; render();};
  const so=$("#so"); if(so) so.onclick=signOut;
}

// ---------------------------------------------------------------- boot
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ S.session=null; S.me=null; S.roles=[]; render(); } });
(async()=>{ try{ await loadContext(); } catch(e){ console.error(e); } render(); })();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
